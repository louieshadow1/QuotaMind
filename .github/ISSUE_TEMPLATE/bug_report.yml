name: Bug 报告
description: 面板显示不对、接口报错、启动失败
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先确认：用的是最新版本、`node --version` ≥ 20、并且没有把 `data/` 里的密钥粘贴到 issue 里。
  - type: input
    id: version
    attributes:
      label: 版本 / 提交号
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node 版本（`node --version`）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志（**请先删除密钥、token、账号邮箱**）
      render: shell
